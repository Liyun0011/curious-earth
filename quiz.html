<head>

<link rel="stylesheet" href="style.css?v=20261113c">
<!-- 先套用深淺色，避免畫面閃一下 -->

  try {
    document.documentElement.dataset.theme = localStorage.getItem("theme") ||
      (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  } catch (e) {}
</script>
</head>
<body>

<header class="site-header">
  <div class="inner">
    <a class="brand" href="index.html">
      <span class="logo" aria-hidden="true"></span>
      <span>
        <span class="brand-name" data-i18n="brand">地球人的奇妙日常</span>
        <span class="brand-en">CURIOUS EARTH CLUB</span>
      </span>
    </a>
    <nav class="site-nav" aria-label="主選單" data-i18n-aria="nav.label">
      <a href="index.html" data-i18n="nav.map">探索地圖</a>
      <a href="culture.html" data-i18n="nav.culture">文化圖鑑</a>
      <a href="quiz.html" class="active" aria-current="page" data-i18n="nav.quiz">猜猜在哪國 ↗</a>
      <a href="share.html" data-i18n="nav.share">分享你的日常</a>
      <a href="about.html" data-i18n="nav.about">關於我們</a>
    </nav>
  </div>
</header>

<main class="page">
  <div class="quiz">
    <div class="page-head">
      <div>
        <h1 data-i18n="quiz.title">猜猜在哪國？</h1>
        <p data-i18n="quiz.sub">看線索猜國家，一共 10 題。</p>
      </div>
    </div>
    <section class="card" id="quiz" aria-live="polite"></section>
  </div>
</main>

<footer class="site-footer" data-i18n="footer">地球人的奇妙日常 · 網頁製作期末專題</footer>

<script src="data.js?v=20261113c"></script>
<script src="i18n.js?v=20261113c"></script>
<script src="app.js?v=20261113c"></script>
<script>
const TOTAL = 10;
// 測驗狀態：換語言時用同一份狀態重畫，不會重新出題
let questions = [];   // [{ fid: "TW", answer: "TW", options: ["TW", "JP", ...], picked: null }]
let index = 0;
let score = 0;
let finished = false;
const box = document.getElementById("quiz");

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// 把線索裡的國名（中文、英文）遮起來，免得直接看到答案
function hideName(text, code) {
  const c = COUNTRIES[code];
  return [c.name, c.en].reduce((s, name) => s.split(name).join("＿＿"), text);
}

// 錯誤選項盡量挑同一洲的國家，比較有挑戰性
function pickOptions(answer) {
  const sameContinent = CODES.filter(x => x !== answer && COUNTRIES[x].continent === COUNTRIES[answer].continent);
  const others = sameContinent.length >= 3 ? sameContinent : CODES.filter(x => x !== answer);
  return shuffle([answer, ...shuffle(others).slice(0, 3)]);
}

function start() {
  // 每一題來自不同國家
  const picked = new Set();
  questions = shuffle(FACTS).filter(f => !picked.has(f.code) && picked.add(f.code)).slice(0, TOTAL).map(f => ({
    fid: f.id,
    answer: f.code,
    options: pickOptions(f.code),
    picked: null
  }));
  index = 0;
  score = 0;
  finished = false;
  render();
}

function render() {
  finished ? renderResult() : renderQuestion();
}

function renderQuestion() {
  const q = questions[index];
  const c = F(FACT_BY_ID[q.fid]);
  box.innerHTML = `
    <div class="pop">
      <div class="quiz-top"><span>${t("quiz.progress", { n: index + 1, total: TOTAL })}</span><span>${t("quiz.score", { n: score })}</span></div>
      <div class="bar"><span style="width:${index / TOTAL * 100}%"></span></div>
      <div class="big-emoji" style="margin-top:20px">${c.emoji}</div>
      <h2>${c.title}</h2>
      <p class="clue">${hideName(c.fact, q.answer)}</p>
      <div class="options">${q.options.map(code =>
        `<button class="option" data-code="${code}">${countryName(code)}</button>`).join("")}
      </div>
      <div class="feedback" id="feedback"></div>
    </div>`;
  box.querySelectorAll(".option").forEach(btn => btn.onclick = () => answerWith(btn.dataset.code));
  if (q.picked) showFeedback();
}

function answerWith(picked) {
  const q = questions[index];
  q.picked = picked;
  if (picked === q.answer) {
    score++;
    if (soundOn) playTune(tuneKey(FACT_BY_ID[q.fid]));   // 答對就播這則的小曲
  }
  box.querySelector(".quiz-top span:last-child").textContent = t("quiz.score", { n: score });
  showFeedback();
}

function showFeedback() {
  const q = questions[index];
  const c = F(FACT_BY_ID[q.fid]);
  const right = q.picked === q.answer;
  box.querySelectorAll(".option").forEach(btn => {
    btn.disabled = true;
    if (btn.dataset.code === q.answer) btn.classList.add("correct");
    else if (btn.dataset.code === q.picked) btn.classList.add("wrong");
  });

  const last = index === TOTAL - 1;
  document.getElementById("feedback").innerHTML = `
    <div class="verdict">${right ? t("quiz.right") : t("quiz.wrong", { name: c.name })}</div>
    ${c.bonus ? `<div class="bonus" style="margin-top:8px"><b>💡 ${t("card.didYouKnow")}</b>${c.bonus}</div>` : ""}
    <div class="card-actions">
      <a class="btn ghost" href="index.html#${q.fid}">${t("quiz.onMap")}</a>
      <button class="btn" id="next">${last ? t("quiz.seeResult") : t("quiz.next")}</button>
    </div>`;
  document.getElementById("next").onclick = () => {
    if (last) finished = true; else index++;
    render();
  };
}

function renderResult() {
  const msg = score >= 9 ? t("quiz.msgHigh") : score >= 6 ? t("quiz.msgMid") : t("quiz.msgLow");
  box.innerHTML = `
    <div class="result pop">
      <p>${t("quiz.yourScore")}</p>
      <div class="score">${score} / ${TOTAL}</div>
      <h2>${msg}</h2>
      <div class="card-actions">
        <a class="btn ghost" href="culture.html">${t("quiz.toCulture")}</a>
        <button class="btn ghost" id="share-score">↗ ${t("quiz.shareScore")}</button>
        <button class="btn" id="again">${t("quiz.again")}</button>
      </div>
    </div>`;
  document.getElementById("again").onclick = start;
  document.getElementById("share-score").onclick = () => shareLink({
    title: t("quiz.title"),
    text: t("quiz.shareText", { n: score, total: TOTAL }),
    page: "quiz.html"
  });
  if (score >= 6) confetti();
}

document.addEventListener("langchange", () => {
  // 結果頁換語言時不要再撒一次彩帶
  if (finished) {
    const keep = window.confetti;
    window.confetti = () => {};
    render();
    window.confetti = keep;
  } else {
    render();
  }
});

start();
</script>
</body>
</html>
