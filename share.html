<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-i18n="title.share">分享你的日常｜地球人的奇妙日常</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=20261113f">
<!-- 先套用深淺色，避免畫面閃一下 -->
<script>
  try {
    document.documentElement.dataset.theme = localStorage.getItem("theme") ||
      (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  } catch (e) {}
</script>
</head>
<body>

<header class="site-header">
  <div class="inner">
    <a class="brand" href="index.html">
      <span class="logo" aria-hidden="true"></span>
      <span>
        <span class="brand-name" data-i18n="brand">地球人的奇妙日常</span>
        <span class="brand-en">CURIOUS EARTH CLUB</span>
      </span>
    </a>
    <nav class="site-nav" aria-label="主選單" data-i18n-aria="nav.label">
      <a href="index.html" data-i18n="nav.map">探索地圖</a>
      <a href="culture.html" data-i18n="nav.culture">文化圖鑑</a>
      <a href="quiz.html" data-i18n="nav.quiz">猜猜在哪國 ↗</a>
      <a href="share.html" class="active" aria-current="page" data-i18n="nav.share">分享你的日常</a>
      <a href="about.html" data-i18n="nav.about">關於我們</a>
    </nav>
  </div>
</header>

<main class="page">
  <div class="page-head">
    <div>
      <h1 data-i18n="nav.share">分享你的日常</h1>
      <p data-i18n="share.sub">你覺得理所當然的小事，可能是別人眼中的不可思議。寫下來，讓它出現在文化圖鑑裡！</p>
    </div>
    <span class="mode" id="mode" data-i18n="share.checking">檢查連線中…</span>
  </div>

  <div class="share-layout">
    <section class="card form-card" id="form-area">
      <form id="share-form" novalidate>

        <div class="row">
          <div class="field">
            <label for="nickname"><span data-i18n="share.nickname">暱稱</span><span class="req">*</span></label>
            <input type="text" id="nickname" name="nickname" required maxlength="20" data-i18n-placeholder="share.nicknamePh" placeholder="例如：台科小資">
          </div>
          <div class="field">
            <label for="country"><span data-i18n="share.country">國家／地區</span><span class="req">*</span></label>
            <!-- 可搜尋的下拉選單（combobox）：打字篩選，也可以直接捲動挑選 -->
            <div class="combo">
              <input type="text" id="country" name="country" required maxlength="30" autocomplete="off"
                role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="country-options"
                data-i18n-placeholder="share.countryPh" placeholder="例如：台灣">
              <ul class="combo-list" id="country-options" role="listbox" hidden></ul>
            </div>
          </div>
        </div>

        <div class="field">
          <label for="continent"><span data-i18n="culture.continent">洲別</span><span class="req">*</span></label>
          <!-- value 固定用中文，因為後端用中文檢查；畫面上顯示的文字會跟著語言切換 -->
          <select id="continent" name="continent" required>
            <option value="" data-i18n="share.choose">請選擇</option>
            <option value="亞洲" data-i18n="cont.asia">亞洲</option>
            <option value="歐洲" data-i18n="cont.europe">歐洲</option>
            <option value="美洲" data-i18n="cont.americas">美洲</option>
            <option value="非洲" data-i18n="cont.africa">非洲</option>
            <option value="大洋洲" data-i18n="cont.oceania">大洋洲</option>
          </select>
        </div>

        <fieldset class="field">
          <legend><span data-i18n="share.category">分類</span><span class="req">*</span></legend>
          <div class="radio-group">
            <label><input type="radio" name="category" value="festival" required><span data-i18n="cat.festival">節慶</span></label>
            <label><input type="radio" name="category" value="daily" checked><span data-i18n="cat.daily">生活日常</span></label>
            <label><input type="radio" name="category" value="trivia"><span data-i18n="cat.trivia">冷知識</span></label>
          </div>
        </fieldset>

        <fieldset class="field">
          <legend data-i18n="share.icon">卡片圖示</legend>
          <div class="radio-group emoji-group" id="emoji-group"></div>
        </fieldset>

        <div class="field">
          <label for="title"><span data-i18n="share.titleLabel">標題</span><span class="req">*</span><span class="hint" data-i18n="share.titleHint">2～20 字，一句話抓住重點</span></label>
          <input type="text" id="title" name="title" required minlength="2" maxlength="20" data-i18n-placeholder="share.titlePh" placeholder="例如：宵夜是一種文化">
        </div>

        <div class="field">
          <label for="content"><span data-i18n="share.content">想分享的日常</span><span class="req">*</span><span class="hint" data-i18n="share.contentHint">20～200 字</span></label>
          <textarea id="content" name="content" required minlength="20" maxlength="200"
            data-i18n-placeholder="share.contentPh" placeholder="在我們這裡……，但外國朋友聽到都很驚訝！"></textarea>
          <div class="counter" id="counter">0 / 200</div>
        </div>

        <label class="check field">
          <input type="checkbox" name="agree" value="yes" required>
          <span data-i18n="share.agree">我同意將這則內容公開在「文化圖鑑」</span><span class="req">*</span>
        </label>

        <div class="form-actions">
          <button type="submit" class="btn" id="submit-btn" data-i18n="share.submit">送出投稿</button>
          <button type="reset" class="btn ghost" data-i18n="share.reset">清除</button>
        </div>
        <div class="form-error" id="form-error" role="alert"></div>
      </form>
    </section>

    <aside class="side">
      <p class="preview-label" data-i18n="share.preview">即時預覽</p>
      <div id="preview"></div>
    </aside>
  </div>

  <h2 class="section-title" data-i18n="share.latest">最新投稿</h2>
  <section class="grid" id="latest"></section>
</main>

<footer class="site-footer" data-i18n="footer">地球人的奇妙日常 · 網頁製作期末專題</footer>

<script src="data.js?v=20261113f"></script>
<script src="i18n.js?v=20261113f"></script>
<script src="app.js?v=20261113f"></script>
<script>
const form = document.getElementById("share-form");
const preview = document.getElementById("preview");
const errorBox = document.getElementById("form-error");
let mode = "local";
let modeReason = "";
let submissions = [];
let lastError = null;    // 記住目前的錯誤，換語言時重新顯示

/* ===== 1. 產生圖示選項、國家建議清單 ===== */
document.getElementById("emoji-group").innerHTML = EMOJIS.map((e, i) =>
  `<label><input type="radio" name="emoji" value="${e}" ${i === 0 ? "checked" : ""}><span>${e}</span></label>`).join("");
/* ===== 國家選單：可以打字搜尋，也可以直接捲動挑 ===== */
const countryInput = form.country;
const optionList = document.getElementById("country-options");
let activeIndex = -1;     // 鍵盤上下鍵目前停在第幾個
let shownCodes = [];

// 常見的其他叫法
const ALIASES = { KR: ["南韓", "大韓民國"], AE: ["阿聯酋", "杜拜"], US: ["美利堅"], GB: ["英格蘭", "蘇格蘭"], CZ: ["捷克共和國"], TW: ["臺灣"] };
const normalize = text => String(text).trim().toLowerCase().replace(/臺/g, "台");

function findCode(text) {
  const v = normalize(text);
  if (!v) return null;
  return CODES.find(c => normalize(COUNTRIES[c].name) === v || COUNTRIES[c].en.toLowerCase() === v ||
    (ALIASES[c] || []).some(a => normalize(a) === v)) || null;
}

function openOptions() {
  const q = normalize(countryInput.value);
  const hit = c => !q || normalize(COUNTRIES[c].name).includes(q) || COUNTRIES[c].en.toLowerCase().includes(q) ||
    (ALIASES[c] || []).some(a => normalize(a).includes(q));
  shownCodes = [];
  let html = "";
  // 依洲別分組；英文模式依英文名排序，中文模式照資料順序
  for (const cont of CONTINENTS) {
    let codes = CODES.filter(c => COUNTRIES[c].continent === cont && hit(c));
    if (LANG === "en") codes = codes.sort((a, b) => COUNTRIES[a].en.localeCompare(COUNTRIES[b].en));
    if (!codes.length) continue;
    html += `<li class="combo-group" role="presentation">${contName(cont)}</li>`;
    for (const c of codes) {
      html += `<li role="option" id="opt-${c}" data-code="${c}" aria-selected="false">
        <span>${countryName(c)}</span><small>${LANG === "en" ? COUNTRIES[c].name : COUNTRIES[c].en}</small></li>`;
      shownCodes.push(c);
    }
  }
  optionList.innerHTML = html || `<li class="combo-empty" role="presentation">${t("share.noCountry")}</li>`;
  optionList.hidden = false;
  countryInput.setAttribute("aria-expanded", "true");
  setActive(q && shownCodes.length ? 0 : -1);
}

function closeOptions() {
  optionList.hidden = true;
  countryInput.setAttribute("aria-expanded", "false");
  countryInput.removeAttribute("aria-activedescendant");
  activeIndex = -1;
}

function setActive(i) {
  activeIndex = i;
  optionList.querySelectorAll("[role=option]").forEach((li, n) => {
    li.classList.toggle("active", n === i);
    li.setAttribute("aria-selected", n === i);
  });
  if (i >= 0) {
    const li = document.getElementById("opt-" + shownCodes[i]);
    countryInput.setAttribute("aria-activedescendant", li.id);
    li.scrollIntoView({ block: "nearest" });
  }
}

// 選定國家：填入名稱，洲別一定跟著換
function chooseCountry(code) {
  countryInput.value = countryName(code);
  form.continent.value = COUNTRIES[code].continent;
  closeOptions();
  updatePreview();
}

countryInput.addEventListener("focus", openOptions);
countryInput.addEventListener("click", openOptions);
countryInput.addEventListener("input", openOptions);
countryInput.addEventListener("keydown", e => {
  if (e.key === "ArrowDown" || e.key === "ArrowUp") {
    e.preventDefault();
    if (optionList.hidden) openOptions();
    if (!shownCodes.length) return;
    const step = e.key === "ArrowDown" ? 1 : -1;
    setActive((activeIndex + step + shownCodes.length) % shownCodes.length);
  } else if (e.key === "Enter" && !optionList.hidden && activeIndex >= 0) {
    e.preventDefault();             // 不要直接送出表單
    chooseCountry(shownCodes[activeIndex]);
  } else if (e.key === "Escape") {
    closeOptions();
  }
});
// 用 mousedown 而不是 click：避免輸入框先失去焦點、清單先關掉
optionList.addEventListener("mousedown", e => {
  const li = e.target.closest("[role=option]");
  if (li) { e.preventDefault(); chooseCountry(li.dataset.code); }
});
countryInput.addEventListener("blur", () => {
  setTimeout(closeOptions, 120);
  // 自己打完整名稱（中英文、常見叫法都可以）也算選到
  const code = findCode(countryInput.value);
  if (code) { form.continent.value = COUNTRIES[code].continent; updatePreview(); }
});

/* ===== 2. 即時預覽與字數 ===== */
function updatePreview() {
  const fd = new FormData(form);
  preview.innerHTML = submissionCard({
    emoji: fd.get("emoji") || "🌏",
    country: fd.get("country") || t("share.country"),
    continent: fd.get("continent") || t("culture.continent"),
    category: fd.get("category") || "daily",
    title: fd.get("title") || t("share.previewTitle"),
    content: fd.get("content") || t("share.previewContent"),
    nickname: fd.get("nickname") || t("share.previewName")
  }, false).replace("pop", "");

  const len = form.content.value.length;
  const counter = document.getElementById("counter");
  counter.textContent = `${len} / 200`;
  counter.classList.toggle("bad", len > 0 && len < 20);
}
form.addEventListener("input", updatePreview);
form.addEventListener("reset", () => setTimeout(() => {
  form.classList.remove("touched");
  showError(null);
  updatePreview();
}));

/* ===== 3. 驗證錯誤訊息 ===== */
function firstError() {
  if (!form.nickname.value.trim()) return ["nickname", "err.nickname"];
  if (!form.country.value.trim()) return ["country", "err.country"];
  if (!form.continent.value) return ["continent", "err.continent"];
  if (form.title.value.trim().length < 2) return ["title", "err.title"];
  if (form.content.value.trim().length < 20) return ["content", "err.content", { n: form.content.value.trim().length }];
  if (!form.agree.checked) return ["agree", "err.agree"];
  return null;
}
// err 可以是 [欄位, 文字代碼, 變數]，或是伺服器傳回的一段文字
function showError(err) {
  lastError = err;
  if (!err) { errorBox.textContent = ""; return; }
  errorBox.textContent = "⚠️ " + (typeof err === "string" ? err : t(err[1], err[2]));
}

/* ===== 4. 送出 ===== */
form.addEventListener("submit", async e => {
  e.preventDefault();
  form.classList.add("touched");
  const err = firstError();
  if (err) {
    showError(err);
    form[err[0]].focus();
    return;
  }
  showError(null);
  const btn = document.getElementById("submit-btn");
  btn.disabled = true;
  btn.textContent = t("share.sending");
  try {
    const { item, published } = await addSubmission(new FormData(form), mode);
    if (published) {
      submissions.unshift(item);
      renderLatest();
    }
    showSuccess(item, published);
  } catch (ex) {
    showError(ex.message);
    btn.disabled = false;
    btn.textContent = t("share.submit");
  }
});

let successState = null;
function showSuccess(item, published) {
  successState = { item, published };
  document.getElementById("form-area").innerHTML = `
    <div class="success pop">
      <div class="big-emoji">🎉</div>
      <h2>${t("share.thanks", { name: escapeHTML(item.nickname) })}</h2>
      <p>${published ? t("share.published") : t("share.pending")}</p>
      <div class="card-actions">
        <a class="btn ghost" href="culture.html#community">${t("share.toCulture")}</a>
        <button class="btn" onclick="location.reload()">${t("share.again")}</button>
      </div>
    </div>`;
}

function renderLatest() {
  document.getElementById("latest").innerHTML = submissions.length
    ? submissions.slice(0, 6).map(s => submissionCard(s)).join("")
    : `<p class="empty">${t("share.none")}</p>`;
}

function renderMode() {
  const label = document.getElementById("mode");
  if (!label.dataset.ready) return;
  label.textContent = mode === "sheet" ? t("mode.sheet") : modeReason === "error" ? t("mode.error") : t("mode.local");
  label.classList.toggle("server", mode === "sheet");
}

document.addEventListener("langchange", () => {
  if (!optionList.hidden) openOptions();
  updatePreview();
  renderMode();
  renderLatest();
  if (lastError) showError(lastError);
  if (successState) showSuccess(successState.item, successState.published);
});

/* ===== 5. 啟動：判斷是存試算表還是存瀏覽器 ===== */
updatePreview();
fetchSubmissions().then(result => {
  mode = result.mode;
  modeReason = result.reason;
  submissions = result.items;
  const label = document.getElementById("mode");
  label.dataset.ready = "1";
  delete label.dataset.i18n;     // 之後由 renderMode 控制文字
  renderMode();
  renderLatest();
});
</script>
</body>
</html>
