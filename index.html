  window.__maps = {};
  window.jsVectorMap = { addMap: function (name, data) { window.__maps[name] = data; } };
</script>

<script>
const explored = loadExplored();
let current = null;      // 目前選的國家代碼
let factIndex = 0;       // 這個國家的第幾則
let filter = "all";
let searchText = "";
let mapLoaded = false;

const svg = document.getElementById("map");
const tooltip = document.getElementById("tooltip");
const card = document.getElementById("card");
const NS = "http://www.w3.org/2000/svg";

// 國家在地圖上的顏色：用它第一則小知識的分類
function mainCat(code) { return FACTS_BY_CODE[code][0].cat; }
// 篩選分類時，只要這國有任何一則符合就顯示
function visible(code) { return filter === "all" || FACTS_BY_CODE[code].some(f => f.cat === filter); }

/* ===== 畫地圖 ===== */
function drawMap() {
  const data = Object.values(window.__maps)[0];
  const status = document.getElementById("status");
  if (!data || !data.paths) {
    status.dataset.i18n = "map.failed";
    status.textContent = t("map.failed");
    return;
  }
  status.remove();
  mapLoaded = true;
  svg.parentElement.classList.add("loaded");
  svg.setAttribute("viewBox", `0 0 ${data.width} ${data.height}`);

  const landLayer = document.createElementNS(NS, "g");
  const pinLayer = document.createElementNS(NS, "g");
  svg.append(landLayer, pinLayer);

  for (const [code, info] of Object.entries(data.paths)) {
    const path = document.createElementNS(NS, "path");
    path.setAttribute("d", info.path);
    path.setAttribute("class", "land");
    path.dataset.code = code;
    path.dataset.en = info.name;
    if (FACTS_BY_CODE[code]) {
      path.classList.add("featured", mainCat(code));
      path.setAttribute("tabindex", "0");
      path.setAttribute("role", "button");
    }
    landLayer.appendChild(path);
  }

  // 圓點：太小不好點的國家，以及地圖上根本沒畫出來的國家
  const toXY = makeProjection(landLayer);
  projectLatLon = toXY;
  const pins = [];
  for (const code of CODES) {
    const path = landLayer.querySelector(`[data-code="${code}"]`);
    let x, y;
    if (path) {
      const b = path.getBBox();
      if (b.width * b.height > 60) continue;          // 夠大，直接點國家就好
      x = b.x + b.width / 2; y = b.y + b.height / 2;
    } else if (toXY) {
      [x, y] = toXY(COUNTRIES[code].lat, COUNTRIES[code].lon);
    } else continue;
    pins.push({ code, x, y });
  }
  for (const pin of pins) {
    const g = document.createElementNS(NS, "g");
    g.setAttribute("class", "pin " + mainCat(pin.code));
    g.dataset.code = pin.code;
    g.setAttribute("tabindex", "0");
    g.setAttribute("role", "button");
    g.innerHTML = `<circle class="pulse"/><circle class="core"/>`;
    pinLayer.appendChild(g);
    pin.el = g;
    pin.tx = pin.x; pin.ty = pin.y;     // 真正的位置（推開之前）
  }
  pinData = pins;
  flyLayer = document.createElementNS(NS, "g");
  flyLayer.setAttribute("class", "fly-layer");
  svg.appendChild(flyLayer);
  setupZoom(data);

  svg.addEventListener("click", e => {
    const code = e.target.closest("[data-code]")?.dataset.code;
    if (FACTS_BY_CODE[code]) select(code, 0, true);
  });
  svg.addEventListener("keydown", e => {
    const code = e.target.closest("[data-code]")?.dataset.code;
    if ((e.key === "Enter" || e.key === " ") && FACTS_BY_CODE[code]) {
      e.preventDefault();
      select(code, 0, true);
    }
  });
  svg.addEventListener("mousemove", e => {
    const el = e.target.closest("[data-code]");
    if (!el) { tooltip.classList.remove("show"); return; }
    const code = el.dataset.code;
    const en = svg.querySelector(`path[data-code="${code}"]`)?.dataset.en || "";
    tooltip.innerHTML = FACTS_BY_CODE[code]
      ? `${FACTS_BY_CODE[code][0].emoji} ${countryName(code)}`
      : `${regionName(code, en)}<small>${t("map.notIncluded")}</small>`;
    const r = svg.parentElement.getBoundingClientRect();
    tooltip.style.left = (e.clientX - r.left) + "px";
    tooltip.style.top = (e.clientY - r.top) + "px";
    tooltip.classList.add("show");
  });
  svg.addEventListener("mouseleave", () => tooltip.classList.remove("show"));

  updateLabels();
  refresh();
}

/* ===== 飛行動畫：✈️ 從上一個國家沿著弧線飛到下一個國家，抵達時冒出那則小知識的圖示 ===== */
let projectLatLon = null;
let flyLayer = null;
let lastCode = null;
let flightId = 0;
const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;

// 國家在地圖上的位置：用經緯度換算（比用形狀的外框中心準，例如美國不會被阿拉斯加拉歪）
function countryPoint(code) {
  const c = COUNTRIES[code];
  if (projectLatLon && c) return projectLatLon(c.lat, c.lon);
  const path = svg.querySelector(`path[data-code="${code}"]`);
  if (!path) return null;
  const b = path.getBBox();
  return [b.x + b.width / 2, b.y + b.height / 2];
}

const ease = t => t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;   // 慢－快－慢

function travel(fromCode, toCode, emoji) {
  const to = countryPoint(toCode);
  if (!to || !flyLayer) return;
  const id = ++flightId;               // 飛到一半又點別的國家，就取消上一趟
  flyLayer.innerHTML = "";
  const from = fromCode && fromCode !== toCode ? countryPoint(fromCode) : null;
  if (!from || reduceMotion) { arrive(to, emoji, id); return; }

  // 弧線：起點和終點中間往上拱，距離越遠拱越高
  const dx = to[0] - from[0], dy = to[1] - from[1];
  const dist = Math.hypot(dx, dy);
  const ctrl = [(from[0] + to[0]) / 2 + dy * 0.25, (from[1] + to[1]) / 2 - Math.abs(dx) * 0.25 - dist * 0.1];
  const route = document.createElementNS(NS, "path");
  route.setAttribute("d", `M${from[0]},${from[1]} Q${ctrl[0]},${ctrl[1]} ${to[0]},${to[1]}`);
  route.setAttribute("class", "fly-route");
  const plane = document.createElementNS(NS, "text");
  plane.setAttribute("class", "fly-plane");
  plane.textContent = "✈️";
  flyLayer.append(route, plane);
  const length = route.getTotalLength();
  const duration = Math.min(2200, Math.max(900, 700 + dist * 2));

  // 地圖有放大的話，鏡頭跟著平移到目的地
  const camFrom = { x: view.x, y: view.y };
  const camTo = { x: to[0] - view.w / 2, y: to[1] - view.h / 2 };
  const followCamera = zoomLevel() > 1.01;

  const t0 = performance.now();
  function frame(now) {
    if (id !== flightId) return;
    const t = Math.min(1, (now - t0) / duration);
    const e = ease(t);
    const k = view.w / full.w;                    // 讓飛機在螢幕上維持一樣大
    const p = route.getPointAtLength(length * e);
    const p2 = route.getPointAtLength(Math.min(length, length * e + 0.5));
    const angle = Math.atan2(p2.y - p.y, p2.x - p.x) * 180 / Math.PI;
    plane.setAttribute("font-size", 16 * k);
    // ✈️ 圖示本身是朝右上 45° 的，所以要多轉 45° 才會對準飛行方向
    plane.setAttribute("transform", `translate(${p.x},${p.y}) rotate(${angle + 45})`);
    route.style.strokeWidth = 1.2 * k;
    route.style.strokeDasharray = `${length * e} ${length}`;    // 航線跟著飛機畫出來
    if (followCamera) {
      view.x = camFrom.x + (camTo.x - camFrom.x) * e;
      view.y = camFrom.y + (camTo.y - camFrom.y) * e;
      applyView();
    }
    if (t < 1) requestAnimationFrame(frame);
    else {
      plane.remove();
      route.classList.add("fade");
      arrive(to, emoji, id);
    }
  }
  requestAnimationFrame(frame);
}

// 抵達：一圈漣漪＋那則小知識的圖示跳出來再飄走
function arrive([x, y], emoji, id) {
  const ring = document.createElementNS(NS, "circle");
  ring.setAttribute("class", "fly-ring");
  ring.setAttribute("cx", x); ring.setAttribute("cy", y);
  const icon = document.createElementNS(NS, "text");
  icon.setAttribute("class", "fly-icon");
  icon.textContent = emoji;
  flyLayer.append(ring, icon);
  const t0 = performance.now();
  const duration = reduceMotion ? 600 : 1600;
  function frame(now) {
    if (id !== flightId) return;
    const t = Math.min(1, (now - t0) / duration);
    const k = view.w / full.w;
    ring.setAttribute("r", (4 + 22 * Math.min(1, t * 1.6)) * k);
    ring.style.strokeWidth = 1.5 * k;
    ring.style.opacity = Math.max(0, 1 - t * 1.6);
    // 圖示：先彈大，再慢慢往上飄、變透明
    const pop = t < 0.2 ? t / 0.2 * 1.35 : t < 0.32 ? 1.35 - (t - 0.2) / 0.12 * 0.35 : 1;
    const lift = t > 0.45 ? (t - 0.45) / 0.55 * 14 : 0;
    icon.setAttribute("font-size", 22 * k * pop);
    icon.setAttribute("x", x);
    icon.setAttribute("y", y - (12 + lift) * k);
    icon.style.opacity = t > 0.6 ? 1 - (t - 0.6) / 0.4 : 1;
    if (t < 1) requestAnimationFrame(frame);
    else flyLayer.innerHTML = "";
  }
  requestAnimationFrame(frame);
}

/* ===== 縮放與拖曳 =====
   用改變 SVG 的 viewBox（看到的範圍）來縮放：範圍越小，看起來越大 */
let pinData = [];
let full = null;    // 整張地圖的範圍
let view = null;    // 目前看到的範圍
let suppressClick = false;
const MAX_ZOOM = 12;

function setupZoom(data) {
  full = { x: 0, y: 0, w: data.width, h: data.height };
  view = { ...full };
  applyView();
  document.getElementById("zoom-ctrl").hidden = false;
  document.getElementById("zoom-hint").hidden = false;

  // 滑鼠滾輪：以游標位置為中心縮放
  svg.addEventListener("wheel", e => {
    e.preventDefault();
    zoomAt(clientToMap(e.clientX, e.clientY), Math.exp(-e.deltaY * 0.0015));
  }, { passive: false });

  // 拖曳移動、兩指縮放（滑鼠、觸控筆、手指都用 Pointer Events 處理）
  const pointers = new Map();
  let start = null;
  svg.addEventListener("pointerdown", e => {
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    start = gestureStart(pointers);
  });
  svg.addEventListener("pointermove", e => {
    if (!pointers.has(e.pointerId)) return;
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    const now = gestureStart(pointers);
    const rect = svg.getBoundingClientRect();
    let w = start.view.w;
    if (pointers.size >= 2 && start.dist) {
      w = clamp(start.view.w * start.dist / now.dist, full.w / MAX_ZOOM, full.w);
    } else if (Math.hypot(now.cx - start.cx, now.cy - start.cy) < 4) {
      return;                                   // 移動太少，當作點擊
    }
    if (zoomLevel() === 1 && pointers.size < 2) return;   // 沒放大時不拖曳，讓手機可以正常捲動頁面
    suppressClick = true;
    if (!svg.hasPointerCapture(e.pointerId)) svg.setPointerCapture(e.pointerId);
    const h = w * full.h / full.w;
    // 讓手指／游標底下的那一點維持在同一個地方
    view = {
      w, h,
      x: start.px - (now.cx - rect.left) / rect.width * w,
      y: start.py - (now.cy - rect.top) / rect.height * h
    };
    applyView();
  });
  const end = e => {
    pointers.delete(e.pointerId);
    if (pointers.size) start = gestureStart(pointers);
  };
  svg.addEventListener("pointerup", end);
  svg.addEventListener("pointercancel", end);
  // 拖曳結束時不要順便選到國家
  svg.addEventListener("click", e => {
    if (suppressClick) { e.stopImmediatePropagation(); suppressClick = false; }
  }, true);

  document.getElementById("zoom-in").onclick = () => zoomAt(center(), 1.6);
  document.getElementById("zoom-out").onclick = () => zoomAt(center(), 1 / 1.6);
  document.getElementById("zoom-reset").onclick = () => { view = { ...full }; applyView(); };
}

// 記下手勢開始時的狀態：中心點、兩指距離、中心點在地圖上的位置
function gestureStart(pointers) {
  const pts = [...pointers.values()];
  const cx = pts.reduce((s, p) => s + p.x, 0) / pts.length;
  const cy = pts.reduce((s, p) => s + p.y, 0) / pts.length;
  const dist = pts.length >= 2 ? Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y) : 0;
  const [px, py] = clientToMap(cx, cy);
  return { cx, cy, dist, px, py, view: { ...view } };
}

function clamp(v, min, max) { return Math.min(max, Math.max(min, v)); }
function zoomLevel() { return full.w / view.w; }
function center() { return [view.x + view.w / 2, view.y + view.h / 2]; }

// 螢幕座標 → 地圖座標
function clientToMap(x, y) {
  const pt = new DOMPoint(x, y).matrixTransform(svg.getScreenCTM().inverse());
  return [pt.x, pt.y];
}

function zoomAt([px, py], factor) {
  const w = clamp(view.w / factor, full.w / MAX_ZOOM, full.w);
  const ratio = w / view.w;
  view = { x: px - (px - view.x) * ratio, y: py - (py - view.y) * ratio, w, h: w * full.h / full.w };
  applyView();
}

let viewFrame = 0;
function applyView() {
  // 不能移出地圖範圍
  view.x = clamp(view.x, 0, full.w - view.w);
  view.y = clamp(view.y, 0, full.h - view.h);
  svg.setAttribute("viewBox", `${view.x} ${view.y} ${view.w} ${view.h}`);
  svg.classList.toggle("zoomed", zoomLevel() > 1.01);
  // 沒放大時，手機可以上下捲動頁面；放大後，手指拖曳是移動地圖
  svg.style.touchAction = zoomLevel() > 1.01 ? "none" : "pan-y";
  cancelAnimationFrame(viewFrame);
  viewFrame = requestAnimationFrame(layoutPins);
}

// 圓點在螢幕上維持一樣大；放大後彼此距離變遠，就慢慢回到真正的位置
function layoutPins() {
  const k = view.w / full.w;
  const pins = pinData.map(p => ({ ...p, x: p.tx, y: p.ty }));
  spreadPins(pins, 7.5 * k);
  for (const p of pins) {
    p.el.querySelectorAll("circle").forEach(c => {
      c.setAttribute("cx", p.x);
      c.setAttribute("cy", p.y);
      c.setAttribute("r", 3.2 * k);
      c.style.strokeWidth = 1.4 * k;
    });
  }
}

// 靠得太近的圓點（例如梵蒂岡和聖馬利諾、加勒比海小島）互相推開，每個都點得到
function spreadPins(pins, minDist) {
  for (let round = 0; round < 60; round++) {
    let moved = false;
    for (let i = 0; i < pins.length; i++) {
      for (let j = i + 1; j < pins.length; j++) {
        const a = pins[i], b = pins[j];
        let dx = b.x - a.x, dy = b.y - a.y;
        let d = Math.hypot(dx, dy);
        if (d >= minDist) continue;
        if (d < 0.01) { dx = 1; dy = 0; d = 1; }      // 完全重疊時，往左右推
        const push = (minDist - d) / 2;
        a.x -= dx / d * push; a.y -= dy / d * push;
        b.x += dx / d * push; b.y += dy / d * push;
        moved = true;
      }
    }
    if (!moved) break;
  }
}

/* 把經緯度換成地圖座標：
   地圖用的是米勒投影（Miller），先用投影公式算出一個值，
   再拿地圖上已經有的國家（知道經緯度、也知道在圖上的位置）去「對齊」比例，
   這樣不用知道地圖檔內部的參數也能算準。 */
function makeProjection(landLayer) {
  const miller = (lat, lon) => [lon * Math.PI / 180, 1.25 * Math.log(Math.tan(Math.PI / 4 + 0.4 * lat * Math.PI / 180))];
  let pts = [];
  for (const [code, c] of Object.entries(COUNTRIES)) {
    const path = landLayer.querySelector(`[data-code="${code}"]`);
    if (!path) continue;
    const b = path.getBBox();
    if (b.width > 120 || b.width * b.height < 4) continue;   // 太大（形狀複雜）或太小都不準，不拿來對齊
    const [mx, my] = miller(c.lat, c.lon);
    pts.push({ mx, my, x: b.x + b.width / 2, y: b.y + b.height / 2 });
  }
  if (pts.length < 10) return null;

  // 一維最小平方法：x ≈ a·mx + b，y ≈ c·my + d
  const fit = (us, vs) => {
    const n = us.length, mu = us.reduce((s, v) => s + v, 0) / n, mv = vs.reduce((s, v) => s + v, 0) / n;
    let num = 0, den = 0;
    us.forEach((u, i) => { num += (u - mu) * (vs[i] - mv); den += (u - mu) ** 2; });
    const k = num / den;
    return [k, mv - k * mu];
  };
  let fx, fy;
  for (let round = 0; round < 2; round++) {          // 第二輪丟掉誤差最大的 20% 再算一次
    fx = fit(pts.map(p => p.mx), pts.map(p => p.x));
    fy = fit(pts.map(p => p.my), pts.map(p => p.y));
    pts = pts
      .map(p => ({ ...p, err: Math.hypot(fx[0] * p.mx + fx[1] - p.x, fy[0] * p.my + fy[1] - p.y) }))
      .sort((a, b) => a.err - b.err)
      .slice(0, Math.ceil(pts.length * 0.8));
  }
  return (lat, lon) => {
    const [mx, my] = miller(lat, lon);
    return [fx[0] * mx + fx[1], fy[0] * my + fy[1]];
  };
}

// 地圖上可點國家的語音說明（螢幕閱讀器用），換語言時要更新
function updateLabels() {
  svg.setAttribute("aria-label", t("map.svgLabel"));
  svg.querySelectorAll(".featured, .pin").forEach(el => {
    el.setAttribute("aria-label", countryName(el.dataset.code));
  });
}

/* ===== 選擇國家 → 顯示小知識卡片 ===== */
// byUser：使用者自己點的才播音樂（瀏覽器不允許網頁自動發出聲音）
function select(code, index = 0, byUser = false) {
  const from = current || lastCode;
  lastCode = code;
  current = code;
  factIndex = index;
  if (!explored.has(code)) {
    explored.add(code);
    saveExplored(explored);
    checkBadges(explored.size);
  }
  renderCountry();
  refresh();
  if (byUser && soundOn) playTune(tuneKey(FACTS_BY_CODE[code][factIndex]), card.querySelector(".play-btn"));
  if (byUser && mapLoaded) travel(from, code, FACTS_BY_CODE[code][factIndex].emoji);
}

function renderCountry() {
  const list = FACTS_BY_CODE[current];
  const f = list[factIndex];
  const fx = F(f);
  card.dataset.tune = tuneKey(f);
  card.innerHTML = `
    <div class="pop">
      <div class="big-emoji">${fx.emoji}</div>
      <h2>${fx.name}</h2>
      <div class="meta"><span>${fx.continent}</span><span class="tag ${fx.cat}">${catName(fx.cat)}</span></div>
      ${list.length > 1 ? `
        <div class="fact-pager">
          <button type="button" class="act" id="prev-fact" aria-label="${t("map.prevFact")}">‹</button>
          <span>${t("map.factOf", { n: factIndex + 1, total: list.length })}</span>
          <button type="button" class="act" id="next-fact" aria-label="${t("map.nextFact")}">›</button>
        </div>` : ""}
      <h3>${fx.title}</h3>
      <p>${fx.fact}</p>
      ${fx.bonus ? `<div class="bonus"><b>💡 ${t("card.didYouKnow")}</b>${fx.bonus}</div>` : ""}
      <p class="tune-name">🎵 ${tuneLabel(tuneKey(f))}</p>
      ${cardActions(f.id, { tune: tuneKey(f), share: shareInfo(fx) })}
      <div class="card-actions">
        <button class="btn ghost" id="back">${t("map.back")}</button>
        <button class="btn" id="next">${t("map.next")}</button>
      </div>
    </div>`;
  document.getElementById("back").onclick = () => { current = null; stopTune(); renderIntro(); refresh(); };
  document.getElementById("next").onclick = () => randomPick(true);
  if (list.length > 1) {
    const go = step => { factIndex = (factIndex + step + list.length) % list.length; renderCountry(); if (soundOn) playTune(tuneKey(list[factIndex]), card.querySelector(".play-btn")); };
    document.getElementById("prev-fact").onclick = () => go(-1);
    document.getElementById("next-fact").onclick = () => go(1);
  }
}

// 起始畫面：搜尋國家，或從推薦的國家開始
let suggestions = [];
function renderIntro() {
  delete card.dataset.tune;
  card.innerHTML = `
    <div class="pop">
      <div class="big-emoji">🧭</div>
      <h2>${t("map.introTitle")}</h2>
      <p>${t("map.introText")}</p>
      <input type="search" class="search" id="country-search" placeholder="${t("map.search")}" value="${escapeHTML(searchText)}" autocomplete="off">
      <p class="pick-hint" id="pick-hint"></p>
      <div class="pick-list" id="pick-list"></div>
    </div>`;
  const input = document.getElementById("country-search");
  input.oninput = () => { searchText = input.value; renderPicks(); };
  renderPicks();
}

function renderPicks() {
  const q = searchText.trim().toLowerCase();
  let codes;
  if (q) {
    codes = CODES.filter(c => visible(c) &&
      (COUNTRIES[c].name.includes(q) || COUNTRIES[c].en.toLowerCase().includes(q))).slice(0, 24);
    document.getElementById("pick-hint").textContent = codes.length ? "" : t("map.noMatch");
  } else {
    // 沒有搜尋時，推薦 12 個還沒探索的國家（換分類時重新挑）
    if (!suggestions.length || suggestions.some(c => !visible(c))) {
      const pool = CODES.filter(c => visible(c) && !explored.has(c));
      suggestions = (pool.length ? pool : CODES.filter(visible)).sort(() => Math.random() - 0.5).slice(0, 12);
    }
    codes = suggestions;
    document.getElementById("pick-hint").textContent = t("map.suggest");
  }
  document.getElementById("pick-list").innerHTML = codes.map(code =>
    `<button data-pick="${code}" class="${explored.has(code) ? "explored" : ""}">${countryName(code)}</button>`).join("");
  card.querySelectorAll("[data-pick]").forEach(b => b.onclick = () => select(b.dataset.pick, 0, true));
}

/* ===== 篩選、隨機、進度 ===== */
function randomPick(byUser = true) {
  const pool = CODES.filter(c => visible(c) && c !== current);
  const unexplored = pool.filter(c => !explored.has(c));
  const list = unexplored.length ? unexplored : pool;
  const code = list[Math.floor(Math.random() * list.length)];
  // 有分類篩選時，直接跳到符合分類的那一則
  const index = Math.max(0, FACTS_BY_CODE[code].findIndex(f => filter === "all" || f.cat === filter));
  select(code, index, byUser);
}

function refresh() {
  svg.querySelectorAll("path.featured").forEach(p => {
    const code = p.dataset.code;
    p.classList.toggle("explored", explored.has(code));
    p.classList.toggle("active", code === current);
    p.classList.toggle("dim", !visible(code));
  });
  svg.querySelectorAll(".pin").forEach(g => {
    g.classList.toggle("explored", explored.has(g.dataset.code));
    g.classList.toggle("active", g.dataset.code === current);
    g.classList.toggle("hidden", !visible(g.dataset.code));
  });
  document.getElementById("progress-label").innerHTML =
    t("map.progress", { n: `<strong>${explored.size}</strong>`, total: CODES.length });
  document.getElementById("bar").style.width = (explored.size / CODES.length * 100) + "%";
  renderBadges(document.getElementById("badges"), explored.size);
}

document.querySelectorAll(".chip").forEach(chip => {
  chip.onclick = () => {
    filter = chip.dataset.filter;
    document.querySelectorAll(".chip").forEach(c => c.setAttribute("aria-pressed", c === chip));
    if (!current) renderPicks();
    refresh();
  };
});
document.getElementById("random").onclick = () => randomPick(true);

// 換語言時，重畫用 JS 產生的內容
document.addEventListener("langchange", () => {
  current ? renderCountry() : renderIntro();
  if (mapLoaded) updateLabels();
  refresh();
});

document.getElementById("stat-countries").textContent = CODES.length;
document.getElementById("stat-facts").textContent = FACTS.length;
renderIntro();
drawMap();
refresh();
// 已經探索過的人第一次看到徽章功能時，不要一次跳出一堆恭喜
if (getSetting("badgesSeen", null) === null) setSetting("badgesSeen", String(badgeList().filter(b => explored.size >= b.n).map(b => b.n).pop() || 0));

// 從圖鑑點「在地圖上看」過來時，網址會帶小知識編號（例如 #TH2、#TW）
function openFromHash() {
  const f = FACT_BY_ID[location.hash.slice(1)];
  if (!f) return;
  select(f.code, FACTS_BY_CODE[f.code].indexOf(f));
  document.getElementById("explore").scrollIntoView();
}
openFromHash();
window.addEventListener("hashchange", openFromHash);
</script>
</body>
</html>
