<section class="hero">
  <div class="rings" aria-hidden="true"><span></span><span></span><span></span><span></span></div>
  <div class="inner">
    <p class="eyebrow">CURIOUS EARTH CLUB</p>
    <h1 data-i18n-html="hero.title">你的日常，<br>是別人眼中的<em>不可思議</em>。</h1>
    <p class="lead" data-i18n="hero.lead">台灣的垃圾車會唱歌、芬蘭有背老婆大賽、衣索比亞一年有 13 個月。點開世界地圖，看看地球人各種意想不到的日常。</p>
    <div class="hero-actions">

<main class="page" id="explore">

      <p data-i18n="map.sub">有顏色的國家都藏著一則意想不到的日常，點點看。</p>
    </div>
    <div class="progress" aria-live="polite">
      <div class="progress-label" id="progress-label"></div>
      <div class="bar"><span id="bar"></span></div>
    </div>
  </div>

  <div class="toolbar" role="group" aria-label="分類篩選" data-i18n-aria="filter.label">
    <button class="chip" data-filter="all" aria-pressed="true" data-i18n="filter.all">全部</button>
    <button class="chip" data-filter="festival" aria-pressed="false"><span class="dot" style="background:var(--festival)"></span><span data-i18n="cat.festival">節慶</span></button>
    <button class="chip" data-filter="daily" aria-pressed="false"><span class="dot" style="background:var(--daily)"></span><span data-i18n="cat.daily">生活日常</span></button>
    <button class="chip" data-filter="trivia" aria-pressed="false"><span class="dot" style="background:var(--trivia)"></span><span data-i18n="cat.trivia">冷知識</span></button>
    <span class="spacer"></span>
    <button class="btn" id="random" data-i18n="map.random">🎲 隨機探索</button>
  </div>

  <div class="map-layout">
    <section class="map-wrap" aria-label="互動世界地圖" data-i18n-aria="map.label">
      <svg id="map" role="img"></svg>
      <div class="tooltip" id="tooltip"></div>
      <div class="map-status" id="status" data-i18n="map.loading">地圖載入中…</div>
    </section>
    <aside class="card side" id="card" aria-live="polite"></aside>
  </div>

  <section class="badge-section">
    <h2 class="section-title" data-i18n="badge.title">🏅 探索徽章</h2>
    <div class="badges-row" id="badges"></div>
  </section>
</main>

<footer class="site-footer" data-i18n="footer.map">地球人的奇妙日常 · 網頁製作期末專題 · 地圖資料：jsvectormap（MIT 授權）</footer>

<!-- 先準備好接收地圖資料的函式，再載入地圖資料檔 -->
<script>
  window.__maps = {};
  window.jsVectorMap = { addMap: function (name, data) { window.__maps[name] = data; } };
</script>
<script src="https://cdn.jsdelivr.net/npm/jsvectormap@1.5.3/dist/maps/world.js"></script>
<script src="data.js?v=20261113b"></script>
<script src="i18n.js?v=20261113b"></script>
<script src="app.js?v=20261113b"></script>

<script>
const explored = loadExplored();
let current = null;
let filter = "all";
let mapLoaded = false;

const svg = document.getElementById("map");
const tooltip = document.getElementById("tooltip");
const card = document.getElementById("card");
const NS = "http://www.w3.org/2000/svg";

/* ===== 畫地圖 ===== */
function drawMap() {
  const data = Object.values(window.__maps)[0];
  const status = document.getElementById("status");
  if (!data || !data.paths) {
    status.dataset.i18n = "map.failed";
    status.textContent = t("map.failed");
    return;
  }
  status.remove();
  mapLoaded = true;
  svg.parentElement.classList.add("loaded");
  svg.setAttribute("viewBox", `0 0 ${data.width} ${data.height}`);

  const landLayer = document.createElementNS(NS, "g");
  const pinLayer = document.createElementNS(NS, "g");
  svg.append(landLayer, pinLayer);

  for (const [code, info] of Object.entries(data.paths)) {
    const path = document.createElementNS(NS, "path");
    path.setAttribute("d", info.path);
    path.setAttribute("class", "land");
    path.dataset.code = code;
    path.dataset.en = info.name;
    if (COUNTRIES[code]) {
      path.classList.add("featured", COUNTRIES[code].cat);
      path.setAttribute("tabindex", "0");
      path.setAttribute("role", "button");
    }
    landLayer.appendChild(path);
  }

  // 小國家不好點，所以在每個收錄國家的中心加一個圓點
  for (const code of CODES) {
    const path = landLayer.querySelector(`[data-code="${code}"]`);
    if (!path) continue;
    const b = path.getBBox();
    const cx = b.x + b.width / 2, cy = b.y + b.height / 2;
    const g = document.createElementNS(NS, "g");
    g.setAttribute("class", "pin " + COUNTRIES[code].cat);
    g.dataset.code = code;
    g.innerHTML =
      `<circle class="pulse" cx="${cx}" cy="${cy}" r="4"/>` +
      `<circle class="core" cx="${cx}" cy="${cy}" r="4"/>`;
    pinLayer.appendChild(g);
  }

  svg.addEventListener("click", e => {
    const code = e.target.closest("[data-code]")?.dataset.code;
    if (COUNTRIES[code]) select(code, true);
  });
  svg.addEventListener("keydown", e => {
    if ((e.key === "Enter" || e.key === " ") && COUNTRIES[e.target.dataset.code]) {
      e.preventDefault();
      select(e.target.dataset.code, true);
    }
  });
  svg.addEventListener("mousemove", e => {
    const el = e.target.closest("[data-code]");
    if (!el) { tooltip.classList.remove("show"); return; }
    const code = el.dataset.code;
    const en = svg.querySelector(`path[data-code="${code}"]`)?.dataset.en || "";
    tooltip.innerHTML = COUNTRIES[code] ? `${C(code).emoji} ${C(code).name}` : `${en}<small>${t("map.notIncluded")}</small>`;
    const r = svg.parentElement.getBoundingClientRect();
    tooltip.style.left = (e.clientX - r.left) + "px";
    tooltip.style.top = (e.clientY - r.top) + "px";
    tooltip.classList.add("show");
  });
  svg.addEventListener("mouseleave", () => tooltip.classList.remove("show"));

  updateLabels();
  refresh();
}

// 地圖上可點國家的語音說明（螢幕閱讀器用），換語言時要更新
function updateLabels() {
  svg.setAttribute("aria-label", t("map.svgLabel"));
  svg.querySelectorAll("path.featured").forEach(p => {
    const c = C(p.dataset.code);
    p.setAttribute("aria-label", `${c.name}：${c.title}`);
  });
}

/* ===== 選擇國家 → 顯示小知識卡片 ===== */
// byUser：使用者自己點的才播音樂（瀏覽器不允許網頁自動發出聲音）
function select(code, byUser = false) {
  current = code;
  if (!explored.has(code)) {
    explored.add(code);
    saveExplored(explored);
    checkBadges(explored.size);
  }
  renderCountry();
  refresh();
  if (byUser && soundOn) playTune(code, card.querySelector(".play-btn"));
}

function renderCountry() {
  const code = current;
  const c = C(code);
  card.dataset.tune = code;
  card.innerHTML = `
    <div class="pop">
      <div class="big-emoji">${c.emoji}</div>
      <h2>${c.name}</h2>
      <div class="meta"><span>${c.continent}</span><span class="tag ${c.cat}">${catName(c.cat)}</span></div>
      <h3>${c.title}</h3>
      <p>${c.fact}</p>
      <div class="bonus"><b>💡 ${t("card.didYouKnow")}</b>${c.bonus}</div>
      <p class="tune-name">🎵 ${tuneLabel(code)}</p>
      ${cardActions(code, { tune: code, share: { title: `${c.name}｜${c.title}`, text: `${c.emoji} ${c.name}｜${c.title} — ${t("brand")}`, hash: code } })}
      <div class="card-actions">
        <button class="btn ghost" id="back">${t("map.back")}</button>
        <button class="btn" id="next">${t("map.next")}</button>
      </div>
    </div>`;
  document.getElementById("back").onclick = () => { current = null; stopTune(); renderIntro(); refresh(); };
  document.getElementById("next").onclick = () => randomPick(true);
}

function renderIntro() {
  delete card.dataset.tune;
  card.innerHTML = `
    <div class="pop">
      <div class="big-emoji">🧭</div>
      <h2>${t("map.introTitle")}</h2>
      <p>${t("map.introText")}</p>
      <div class="pick-list">${CODES.filter(visible).map(code =>
        `<button data-pick="${code}" class="${explored.has(code) ? "explored" : ""}">${C(code).name}</button>`
      ).join("")}</div>
    </div>`;
  card.querySelectorAll("[data-pick]").forEach(b => b.onclick = () => select(b.dataset.pick, true));
}

/* ===== 篩選、隨機、進度 ===== */
function visible(code) { return filter === "all" || COUNTRIES[code].cat === filter; }

function randomPick(byUser = true) {
  const pool = CODES.filter(c => visible(c) && c !== current);
  const unexplored = pool.filter(c => !explored.has(c));
  const list = unexplored.length ? unexplored : pool;
  select(list[Math.floor(Math.random() * list.length)], byUser);
}

function refresh() {
  svg.querySelectorAll("path.featured").forEach(p => {
    const code = p.dataset.code;
    p.classList.toggle("explored", explored.has(code));
    p.classList.toggle("active", code === current);
    p.classList.toggle("dim", !visible(code));
  });
  svg.querySelectorAll(".pin").forEach(g => {
    g.classList.toggle("explored", explored.has(g.dataset.code));
    g.classList.toggle("hidden", !visible(g.dataset.code));
  });
  document.getElementById("progress-label").innerHTML =
    t("map.progress", { n: `<strong>${explored.size}</strong>`, total: CODES.length });
  document.getElementById("bar").style.width = (explored.size / CODES.length * 100) + "%";
  renderBadges(document.getElementById("badges"), explored.size);
}

document.querySelectorAll(".chip").forEach(chip => {
  chip.onclick = () => {
    filter = chip.dataset.filter;
    document.querySelectorAll(".chip").forEach(c => c.setAttribute("aria-pressed", c === chip));
    if (!current) renderIntro();
    refresh();
  };
});
document.getElementById("random").onclick = () => randomPick(true);

// 換語言時，重畫用 JS 產生的內容
document.addEventListener("langchange", () => {
  current ? renderCountry() : renderIntro();
  if (mapLoaded) updateLabels();
  refresh();
});

document.getElementById("stat-countries").textContent = CODES.length;
renderIntro();
drawMap();
refresh();
// 已經探索過的人第一次看到徽章功能時，不要一次跳出一堆恭喜
if (getSetting("badgesSeen", null) === null) setSetting("badgesSeen", String(badgeList().filter(b => explored.size >= b.n).map(b => b.n).pop() || 0));

// 從文化圖鑑點「在地圖上看」過來時，網址會帶 #國家代碼，例如 index.html#TW
const fromHash = location.hash.slice(1);
if (COUNTRIES[fromHash]) {
  select(fromHash);
  document.getElementById("explore").scrollIntoView();
}
</script>
</body>
